name: Verify 3D embryology application

on:
  push:
    branches:
      - main
      - feature/vitelline-veins-3d
      - feat/developmental-animation-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Optuna geometry optimiser
        run: python -m pip install --disable-pip-version-check 'optuna>=4,<5'

      - name: Optimise vessel rendering from authored centre-lines
        run: python scripts/optimize_vessel_geometry.py --trials 80 --output artifacts/geometry-optimization.json

      - name: Upload Optuna geometry report
        uses: actions/upload-artifact@v4
        with:
          name: vessel-geometry-optimization
          path: artifacts/geometry-optimization.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Developmental animation validation
        run: npm run validate:animation

      - name: Production build
        run: npm run build